onboarding = false

[theme]
name = "terminal"

auto_switch = false
[theme.custom]
panel_bg = "reset"
surface0 = "#f5f2e9"
surface1 = "#f6f3eb"
accent = "#ffffff"
red = "#706548"
green = "#6f6644"
yellow = "#6f6645"
blue = "#6e4740"
text = "#492924"
subtext0 = "#706548"
surface_dim = "#85837d"
overlay0 = "#b0a48d"
overlay1 = "#85837d"
[terminal]
# New tabs and panes inherit the focused pane's working directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
previous_tab = "alt+shift+left"
next_tab = "alt+shift+right"
switch_tab = "alt+1..9"
focus_pane_left = "alt+left"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"
split_horizontal = "prefix+h"

# Prefix+Shift+Arrow swaps the focused pane with its neighbor.
[[keys.command]]
key = "prefix+shift+left"
type = "shell"
command = "herdr pane swap --current --direction left"

[[keys.command]]
key = "prefix+shift+down"
type = "shell"
command = "herdr pane swap --current --direction down"

[[keys.command]]
key = "prefix+shift+up"
type = "shell"
command = "herdr pane swap --current --direction up"

[[keys.command]]
key = "prefix+shift+right"
type = "shell"
command = "herdr pane swap --current --direction right"

[[keys.command]]              # toggle the Reviewr sidebar beside your work
key = "prefix+f"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]              # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id> — note the id, not the name

[ui]
accent = "#ffffff"
pane_gaps = true
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#f3f4ff", bold = true, dim = false }],
  [{ token = "agent", fg = "#f3f4ff", bold = true, dim = false }],
]

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = false

# Nord (Omarchy) — https://github.com/basecamp/omarchy/tree/master/themes/nord
# Staged, not enabled. To switch: replace the [theme] blocks above with these
# lines, then run `herdr server reload-config`.
# [theme]
# name = "nord"
#
# auto_switch = false
# [theme.custom]
# panel_bg = "reset"
# surface0 = "#3b4252"
# surface1 = "#434c5e"
# accent = "#88c0d0"
# red = "#bf616a"
# green = "#a3be8c"
# yellow = "#ebcb8b"
# blue = "#81a1c1"
# text = "#d8dee9"
# subtext0 = "#adb5c4"
# surface_dim = "#191c23"
# overlay0 = "#4c566a"
# overlay1 = "#adb5c4"
#
# and under [ui]:  accent = "#88c0d0"

