"$schema" = 'https://starship.rs/config-schema.json'
palette = 'monochrome'

format = """
[░▒▓](accent)\
$username\  
$directory\
$git_branch\
[ ](fg:cyan)\
$character"""

[username]
show_always = false
style_user = "fg:bg bg:accent"
style_root = "fg:bg bg:accent"
format = '[$user ]($style)'
disabled = true

[directory]
style = "fg:bg bg:cyan"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:element"
format = '[[ $symbol $branch ](fg:cyan bg:element)]($style)'

[git_status]
style = "bg:element"
format = '[[($all_status$ahead_behind )](fg:cyan bg:element)]($style)'

[nodejs]
symbol = ""
style = "bg:panel"
format = '[[ $symbol ($version) ](fg:ice bg:panel)]($style)'

[bun]
symbol = ""
style = "bg:panel"
format = '[[ $symbol ($version) ](fg:ice bg:panel)]($style)'

[rust]
symbol = ""
style = "bg:panel"
format = '[[ $symbol ($version) ](fg:ice bg:panel)]($style)'

[golang]
symbol = ""
style = "bg:panel"
format = '[[ $symbol ($version) ](fg:ice bg:panel)]($style)'

[php]
symbol = ""
style = "bg:panel"
format = '[[ $symbol ($version) ](fg:ice bg:panel)]($style)'

[palettes.spacex_terrafab]
bg = "#060114"
panel = "#0d0820"
element = "#1f1a2c"
accent = "#757b9d"
ice = "#a1c4e4"
cyan = "#bad8ff"
text = "#d7dbe9"

[palettes.nord]
bg = "#2e3440"
panel = "#3b4252"
element = "#434c5e"
accent = "#81a1c1"
ice = "#88c0d0"
cyan = "#8fbcbb"
text = "#d8dee9"

[palettes.stills_in_motion]
bg = "#0a0703"
panel = "#23201c"
element = "#605e58"
accent = "#7e8468"
ice = "#cbc3a3"
cyan = "#dfddb2"
text = "#DBD0BC"

# Light theme: roles invert so every foreground stays dark ink on cream.
# panel/element are derived tints of bg toward fg (upstream itself derives
# #f6f3eb the same way); starship needs steps the palette lacks.
[palettes.venice_from_above]
bg = "#f5f2e9"
panel = "#ece8dc"
element = "#ddd7c6"
accent = "#6e4740"
ice = "#706548"
cyan = "#492924"
text = "#492924"

[palettes.monochrome]
bg = "#282828"
panel = "#323232"
element = "#3c3c3c"
accent = "#505050"
ice = "#888888"
cyan = "#d4d4d4"
text = "#d4d4d4"
