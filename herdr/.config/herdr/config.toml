onboarding = false

[theme]
name = "tokyo-night"

auto_switch = false
[theme.custom]
panel_bg = "reset"
surface0 = "#1f1a2c"
surface1 = "#38324f"
accent = "#bad8ff"
red = "#9c8ba9"
green = "#a1c4e4"
yellow = "#c4f6ff"
blue = "#757b9d"
text = "#f3f4ff"
subtext0 = "#a1a4af"
surface_dim = "#0d0820"
overlay0 = "#66656b"
overlay1 = "#a1a4af"

[terminal]
# New tabs and panes inherit the focused pane's working directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
previous_tab = "alt+shift+left"
next_tab = "alt+shift+right"
switch_tab = "alt+1..9"
focus_pane_left = "alt+left"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"
split_horizontal = "prefix+h"

# Prefix+Shift+Arrow swaps the focused pane with its neighbor.
[[keys.command]]
key = "prefix+shift+left"
type = "shell"
command = "herdr pane swap --current --direction left"

[[keys.command]]
key = "prefix+shift+down"
type = "shell"
command = "herdr pane swap --current --direction down"

[[keys.command]]
key = "prefix+shift+up"
type = "shell"
command = "herdr pane swap --current --direction up"

[[keys.command]]
key = "prefix+shift+right"
type = "shell"
command = "herdr pane swap --current --direction right"

[[keys.command]]              # toggle the Reviewr sidebar beside your work
key = "prefix+f"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]              # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id> — note the id, not the name

[ui]
accent = "#bad8ff"
pane_gaps = true
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#f3f4ff", bold = true, dim = false }],
  [{ token = "agent", fg = "#f3f4ff", bold = true, dim = false }],
]

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = false
