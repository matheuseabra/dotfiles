onboarding = false

[theme]
name = "tokyo-night"

auto_switch = false
[theme.custom]
panel_bg = "reset"
surface0 = "#1f1a2c"
surface1 = "#38324f"
accent = "#bad8ff"
red = "#9c8ba9"
green = "#a1c4e4"
yellow = "#c4f6ff"
blue = "#757b9d"
text = "#f3f4ff"
subtext0 = "#a1a4af"
surface_dim = "#0d0820"
overlay0 = "#66656b"
overlay1 = "#a1a4af"

[terminal]
# New tabs and panes inherit the focused pane's working directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
previous_tab = "alt+shift+left"
next_tab = "alt+shift+right"
switch_tab = "alt+1..9"
focus_pane_left = "alt+left"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"
split_horizontal = "prefix+h"

# Prefix+Shift+Arrow swaps the focused pane with its neighbor.
[[keys.command]]
key = "prefix+shift+left"
type = "shell"
command = "herdr pane swap --current --direction left"

[[keys.command]]
key = "prefix+shift+down"
type = "shell"
command = "herdr pane swap --current --direction down"

[[keys.command]]
key = "prefix+shift+up"
type = "shell"
command = "herdr pane swap --current --direction up"

[[keys.command]]
key = "prefix+shift+right"
type = "shell"
command = "herdr pane swap --current --direction right"

[[keys.command]]              # toggle the Reviewr sidebar beside your work
key = "prefix+f"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]              # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id> — note the id, not the name

[ui]
accent = "#bad8ff"
pane_gaps = true
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#f3f4ff", bold = true, dim = false }],
  [{ token = "agent", fg = "#f3f4ff", bold = true, dim = false }],
]

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = false

# Nord (Omarchy) — https://github.com/basecamp/omarchy/tree/master/themes/nord
# Staged, not enabled. To switch: replace the [theme] blocks above with these
# lines, then run `herdr server reload-config`.
# [theme]
# name = "nord"
#
# auto_switch = false
# [theme.custom]
# panel_bg = "reset"
# surface0 = "#3b4252"
# surface1 = "#434c5e"
# accent = "#88c0d0"
# red = "#bf616a"
# green = "#a3be8c"
# yellow = "#ebcb8b"
# blue = "#81a1c1"
# text = "#d8dee9"
# subtext0 = "#adb5c4"
# surface_dim = "#191c23"
# overlay0 = "#4c566a"
# overlay1 = "#adb5c4"

# Stills in Motion (mattbbia/stills-in-motion)
# Staged, not enabled. To switch: replace the [theme] blocks above with these
# lines, then run `herdr server reload-config`.
# [theme]
# name = "stills-in-motion"
#
# auto_switch = false
# [theme.custom]
# panel_bg = "reset"
# surface0 = "#23201c"
# surface1 = "#605e58"
# accent = "#7e8468"
# red = "#a2947d"
# green = "#cbc3a3"
# yellow = "#fef2cb"
# blue = "#7e8468"
# text = "#DBD0BC"
# subtext0 = "#a49c8d"
# surface_dim = "#050402"
# overlay0 = "#6a6257"
# overlay1 = "#a49c8d"
