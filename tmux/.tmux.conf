# Change prefix to Alt+a (Option+a on Mac)
set -g prefix M-a
unbind C-b
bind M-a send-prefix

# window navigation and creation
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind n next-window
bind p previous-window
bind c new-window -c "$HOME"
bind d kill-window

# Seamless pane navigation across tmux and Neovim
set -g @vim_navigator_mapping_left "M-h M-Left"
set -g @vim_navigator_mapping_right "M-l M-Right"
set -g @vim_navigator_mapping_up "M-k M-Up"
set -g @vim_navigator_mapping_down "M-j M-Down"
set -g @vim_navigator_mapping_prev ""

# Mouse support
set -g mouse on

set-option -g status-position top

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Better colors
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g status on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_transparent 1

# Widgets
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_wbg 0             # off unless you configure GitHub/GitLab tokens
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_battery_widget 1
set -g @tokyo-night-tmux_show_music 0           # needs nowplaying-cli/playerctl + setup
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_hostname 1
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_window_tidy_icons 1   # 1 = no extra space | 0 = add space (default)

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
