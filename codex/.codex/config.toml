model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
web_search = "live"
sandbox_mode = "danger-full-access"
approval_policy = "never"
personality = "pragmatic"
network_access = "enabled"
tool_output_token_limit = 25000
model_auto_compact_token_limit = 233000
approvals_reviewer = "auto_review"

[analytics]
enabled = false

[tui.keymap.editor]
insert_newline = ["ctrl-j", "alt-enter"]

[features]
multi_agent = true
plugin_hooks = true
plugins = true
hooks = true
ghost_commit = true
unified_exec = true
apply_patch_freeform = true
skills = true
shell_snapshot = true
goals = true
default_mode_request_user_input = true

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.aseprite]
command = "/Users/matheusseabra/.local/bin/uv"
args = ["--directory", "/Users/matheusseabra/.local/share/aseprite-mcp", "run", "-m", "aseprite_mcp"]

[mcp_servers.aseprite.env]
ASEPRITE_PATH = "/Applications/Aseprite.app/Contents/MacOS/aseprite"

[mcp_servers.xcodebuildmcp]
command = "xcodebuildmcp"
args = ["mcp"]

[mcp_servers.godot]
command = "npx"
args = ["@coding-solo/godot-mcp"]

[mcp_servers.godot.env]
DEBUG = "true"
GODOT_PATH = "/Applications/Godot.app/Contents/MacOS/Godot"

[mcp_servers.vercel]
url = "https://mcp.vercel.com"

[mcp_servers.render]
url = "https://mcp.render.com/mcp"

[sandbox_workspace_write]
network_access = true

[notice]
hide_world_writable_warning = true
hide_full_access_warning = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-remaining", "task-progress"]
status_line_use_colors = true
theme = "nord"

[plugins."build-ios-apps@openai-curated"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."omo@sisyphuslabs"]
enabled = true

[plugins."omo@sisyphuslabs".mcp_servers.context7]
enabled = true

[plugins."omo@sisyphuslabs".mcp_servers.codegraph]
enabled = true
